services:
  openvpn-as:
    image: openvpn/openvpn-as:latest
    container_name: ${CONTAINER_NAME:-openvpn-as}
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - MKNOD
      - NET_ADMIN
    ports:
      - "${HOST_ADMIN_PORT:-943}:943"
      - "${HOST_HTTPS_PORT:-8443}:443"
      - "${HOST_UDP_PORT:-1194}:1194/udp"
    volumes:
      - ${OVPN_DATA:-/root/openvpn-data}:/openvpn
    restart: unless-stopped

  telegram-bot:
    build:
      context: ./telegram-bot
    image: openvpn-telegram-bot:local
    container_name: ${TELEGRAM_BOT_CONTAINER_NAME:-openvpn-telegram-bot}
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_USERNAME: ${TELEGRAM_ADMIN_USERNAME:-}
      CONTAINER_NAME: ${CONTAINER_NAME:-openvpn-as}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      HOST_HTTPS_PORT: ${HOST_HTTPS_PORT:-8443}
      HOST_UDP_PORT: ${HOST_UDP_PORT:-1194}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - openvpn-as
    restart: unless-stopped
